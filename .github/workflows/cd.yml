name: CD

# Despliegue continuo: publica en Azure una compilación que el CI ya probó y guardó.
# No compila nada: descarga la compilación de una ejecución del CI y la sube al sitio.
#
# Se ejecuta de dos formas:
# - Automática: cuando el workflow CI termina bien sobre un cambio en main.
# - Manual: desde la pestaña Actions. Sin datos, publica la última compilación correcta
#   de main; indicando el número de una ejecución del CI, publica esa compilación.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ejecucion:
        description: "Número de la ejecución del CI a publicar. Vacío: la última correcta de main"
        required: false
        type: string

# Por defecto el workflow solo puede leer el código. El job pide lo que le falte.
permissions:
  contents: read

# Un solo despliegue a la vez, y nunca se interrumpe uno que ya empezó.
concurrency:
  group: cd-produccion
  cancel-in-progress: false

# No es un secreto: solo dice dónde se publica.
env:
  STORAGE_ACCOUNT: stexpirycontrolweb

jobs:
  deploy:
    name: Desplegar en Azure
    # Automático: solo si el CI terminó bien y no venía de un Pull Request.
    # Manual: solo desde main, la única rama en la que Azure confía.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event != 'pull_request')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Permite descargar la compilación guardada por el CI.
      actions: read
      # Permite pedir a GitHub el token OIDC con el que se inicia sesión en Azure.
      id-token: write
    steps:
      # Se publica la compilación de una ejecución correcta del CI sobre main.
      - name: Elegir la compilación
        id: origen
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION_CI: ${{ github.event.workflow_run.id }}
          EJECUCION_MANUAL: ${{ inputs.ejecucion }}
        run: |
          set -euo pipefail
          if [ -n "$EJECUCION_CI" ]; then
            ejecucion="$EJECUCION_CI"
          elif [ -n "$EJECUCION_MANUAL" ]; then
            ejecucion="$EJECUCION_MANUAL"
          else
            ejecucion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if ! [[ "$ejecucion" =~ ^[0-9]+$ ]]; then
            echo "No hay una ejecución válida del CI para publicar"
            exit 1
          fi

          datos="$(gh run view "$ejecucion" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,conclusion,headSha \
            --jq '"\(.workflowName) \(.headBranch) \(.conclusion) \(.headSha[0:7])"')"
          read -r nombre rama resultado commit <<< "$datos"
          if [ "$nombre" != "CI" ] || [ "$rama" != "main" ] || [ "$resultado" != "success" ]; then
            echo "La ejecución $ejecucion no es un CI correcto sobre main: no se publica nada"
            exit 1
          fi
          echo "ejecucion=$ejecucion" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Compilación a publicar: ejecución $ejecucion del CI (commit $commit)"

      # Si la compilación ya no existe (se guarda 30 días), este paso falla y no se toca el sitio.
      - name: Recuperar la compilación
        uses: actions/download-artifact@v8
        with:
          name: sitio
          path: dist
          run-id: ${{ steps.origen.outputs.ejecucion }}
          github-token: ${{ github.token }}

      # Inicio de sesión sin contraseña (OIDC). Los tres valores son identificadores.
      - name: Iniciar sesión en Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # El sitio estático sirve lo que haya en el contenedor $web de la cuenta.
      # no-cache hace que el navegador pregunte siempre si hay una versión nueva.
      - name: Subir los archivos al sitio
        run: |
          set -euo pipefail
          inicio="$(date -u +%Y-%m-%dT%H:%MZ)"
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" --auth-mode login \
            --destination '$web' --source dist \
            --overwrite --content-cache-control "no-cache" \
            --no-progress --only-show-errors --output none

          # Borra lo que quedó de versiones anteriores: todo lo que no se acaba de subir.
          az storage blob delete-batch \
            --account-name "$STORAGE_ACCOUNT" --auth-mode login \
            --source '$web' --if-unmodified-since "$inicio" \
            --only-show-errors --output none

      # El despliegue se da por bueno cuando la URL pública entrega la compilación recién subida.
      - name: Comprobar el sitio publicado
        run: |
          set -euo pipefail
          url="$(az storage account show --name "$STORAGE_ACCOUNT" --query primaryEndpoints.web --output tsv)"
          url="${url%/}"
          bundle="$(grep -oE '/_expo/static/js/web/[^"]+\.js' dist/index.html | head -n 1)"

          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$url/" 2> /dev/null | grep -qF "$bundle" \
              && curl -fsS --max-time 20 -o /dev/null "$url$bundle"; then
              echo "Sitio publicado en $url"
              {
                echo "### Despliegue correcto"
                echo ""
                echo "Compilación del commit **${{ steps.origen.outputs.commit }}** publicada en $url"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "El sitio no entrega la compilación recién subida"
          exit 1
