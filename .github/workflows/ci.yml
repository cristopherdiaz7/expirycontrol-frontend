name: CI

# Integración continua: tests y compilación web en cada cambio.
# En main, además, la compilación se guarda para que la publique el workflow CD.
# Este workflow nunca despliega: de eso se encarga cd.yml, cuando el CI termina bien.
on:
  push:
    branches: [main]
    # Un cambio que solo toca documentación no genera una imagen nueva ni despliega.
    paths-ignore:
      - "**.md"
  # En un Pull Request corre siempre, aunque solo cambie documentación:
  # así se ve que el CI prueba y construye sin desplegar.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Por defecto el workflow solo puede leer el código. Cada job pide lo que le falte.
permissions:
  contents: read

# Si llega un cambio nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No es un secreto: la dirección del backend queda escrita en el JavaScript que
# descarga el navegador.
env:
  API_URL: https://ca-expirycontrol-backend.jollysea-7a4f1f80.northcentralus.azurecontainerapps.io

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # npm ci instala exactamente las versiones de package-lock.json.
      - name: Instalar las dependencias
        run: npm ci

      - name: Ejecutar los tests
        run: npm test -- --ci

  build:
    name: Compilar web
    # Solo si los tests pasaron.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar las dependencias
        run: npm ci

      # Expo escribe el valor de EXPO_PUBLIC_API_URL dentro del JavaScript al compilar.
      # Aquí no hay archivo .env: el valor sale de este workflow.
      - name: Compilar la versión web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}

      - name: Comprobar la compilación
        run: |
          test -f dist/index.html
          if ! grep -rqF "$API_URL" dist/_expo; then
            echo "La dirección del backend no quedó en el JavaScript compilado"
            exit 1
          fi
          if grep -rqE "localhost:8080" dist/_expo; then
            echo "El JavaScript compilado apunta a localhost"
            exit 1
          fi
          echo "Archivos generados: $(find dist -type f | wc -l)"

      # Lo que se publica es exactamente esta compilación: el CD no vuelve a compilar.
      # Se guarda 30 días para poder redesplegarla a mano desde el workflow CD.
      # En un Pull Request no se guarda: ahí solo se prueba que compila.
      - name: Guardar la compilación para el workflow CD
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sitio
          path: dist/
          retention-days: 30
